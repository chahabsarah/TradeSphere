<div class="container-fluid">
  <div class="row">
    <div class="col-xl-5" [ngStyle]="{'background-image': 'url(assets/images/login/3.png)',
                                      'background-size': 'cover',
                                      'background-position': 'center center',
                                      'display': 'block'}">
      <img class="bg-img-cover bg-center d-none" src="assets/images/login/3.png" alt="looginpage">
    </div>
    <div class="col-xl-7 p-0">    
      <div class="login-card login-dark">
        <div>
          <div>
            <a class="logo text-start" href="#">
            </a>
          </div>
          <div class="login-main"> 
            <form class="theme-form" (ngSubmit)="login()">
              <h4>Sign in to 
                Trade Sphere <img class="img-fluid for-light" src="assets/images/logo/logo.png" alt="looginpage" style="width: 50px;">
              </h4>
              <p>Enter your email & password to login</p>
              <div class="form-group">
                <label class="col-form-label">Email Address</label>
                <input class="form-control" type="email" required="" placeholder="app@yourmail.com" [(ngModel)]="loginRequest.email">
              </div>
              <div class="form-group">
                <label class="col-form-label">Password</label>
                <input class="form-control" [type]="show ? 'text' : 'password'" name="login[password]" required="" placeholder="*********"  [(ngModel)]="loginRequest.password">
                <div class="show-hide" (click)="showPassword()" *ngIf="!show"><span class="show"></span></div>
                <div class="show-hide" (click)="showPassword()" *ngIf="show"><span class="Hide"></span></div>
              </div>
              <div class="form-group mb-0">
                <div class="checkbox p-0">
                  <input id="checkbox1" type="checkbox">
                  <label class="text-muted" for="checkbox1">Remember password</label>
                </div>
                <a [routerLink]="'/authentication/forgot-password'" class="link">Forgot password?</a>
                <button class="btn btn-primary d-block w-100" type="submit">Sign in</button>
              </div>

              <p class="mt-4 mb-0">Don't have account?
                <a [routerLink]="'/authentication/register/simple'" class="ms-2">Create Account</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
